name: Python tests

on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install optional evidence parsers
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run contract and parser tests
        env:
          PYTHONPATH: code
        run: |
          python -m unittest discover -s code/tests -v
          python -m unittest discover -s code/evaluation -p "test_*.py" -v
