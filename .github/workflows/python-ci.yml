name: Python audit baseline
on:
  push:
    branches:
      - feat/deletion-audit-agent
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m py_compile code/main.py code/evaluation/main.py code/tests/test_main.py
      - name: Run unit tests
        run: python -m unittest discover -s code/tests -v
      - name: Generate full output
        run: python code/main.py
      - name: Validate output and public sample
        run: python code/evaluation/main.py
